<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Auren Console</title>
<link rel="stylesheet" href="/brand/tokens.css">
<style>
  /* Brand tokens come from brand/tokens.css. Gold means you: only approvals and the mark are gold. */
  :root { --bg:var(--auren-onyx); --panel:var(--auren-graphite); --raised:var(--auren-raised); --line:var(--auren-seam); --text:var(--auren-halo); --dim:var(--auren-ash); --gold:var(--auren-aurum); --done:var(--auren-done); --bad:var(--auren-stopped); --proof:var(--auren-proof); }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 var(--auren-text); }
  header { display:flex; align-items:center; gap:12px; padding:16px 20px; border-bottom:1px solid var(--line); }
  .brand { font-family:var(--auren-display); letter-spacing:.32em; color:var(--text); }
  .me { color:var(--dim); font-size:13px; }
  .chips { margin-left:auto; display:flex; gap:6px; flex-wrap:wrap; }
  .chip { font-size:12px; padding:3px 9px; border:1px solid var(--line); border-radius:999px; color:var(--dim); }
  .chip.on { border-color:var(--text); color:var(--text); }
  .trust { font-size:12px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  .trust.ok::before { content:"✓ "; color:var(--done); }
  .trust.bad { color:var(--bad); }
  .trust.bad::before { content:"■ "; }
  main { max-width:760px; margin:0 auto; padding:16px 16px 140px; }
  .ev { display:flex; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); }
  .ev .k { width:84px; flex:none; font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); padding-top:2px; }
  .ev.receipt .k { color:var(--done); }
  .ev.approval .k { color:var(--gold); }
  .ev.error .k { color:var(--bad); }
  .ev .b { flex:1; min-width:0; overflow-wrap:anywhere; }
  .ev .t { color:var(--dim); font-size:12px; margin-left:8px; }
  .ev .proof { color:var(--proof); margin-left:8px; font-size:13px; }
  .ev .signed { color:var(--done); margin-left:8px; font-size:13px; }
  .ev .seen { display:block; max-width:min(220px, 100%); margin-top:8px; border:1px solid var(--line); border-radius:8px; }
  .ev .frame { display:block; width:100%; max-width:320px; border-radius:8px; border:1px solid var(--line); margin-bottom:6px; }
  .pair .code { font:600 30px/1.2 var(--auren-mono); letter-spacing:.14em; margin:10px 0 6px; }
  .pair .dev { display:flex; gap:10px; align-items:center; padding:8px 0; border-top:1px solid var(--line); font-size:14px; }
  .pair .dev span { flex:1; min-width:0; }
  .pair .muted { color:var(--dim); font-size:12px; }
  .ev button { margin-left:8px; }
  .approval, .card { margin:12px 0; padding:14px 16px; border:1px solid var(--line); border-radius:14px; background:var(--panel); }
  .approval { border-color:var(--gold); }
  .approval .row { margin-top:10px; display:flex; gap:8px; }
  button { font:inherit; font-size:13px; padding:6px 12px; border-radius:10px; border:1px solid var(--line); background:var(--raised); color:var(--text); cursor:pointer; }
  button.gold { background:var(--gold); color:var(--bg); border-color:var(--gold); font-weight:600; }
  form { position:fixed; left:0; right:0; bottom:0; padding:12px 16px 20px; background:linear-gradient(transparent, var(--bg) 30%); }
  .bar { max-width:760px; margin:0 auto; display:flex; gap:8px; }
  input[type=text] { flex:1; font:inherit; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:var(--panel); color:var(--text); }
  input[type=text]:focus { outline:none; border-color:var(--dim); }
  .tools { max-width:760px; margin:8px auto 0; display:flex; gap:14px; color:var(--dim); font-size:12px; }
  @media (max-width:520px) { .ev .k { width:64px; } .chips, .me { display:none; } .trust { margin-left:auto; } }
  /* R13: the token alarm and limit banner */
  .spend { margin:12px 0; padding:12px 14px; border:1px solid var(--line); border-radius:14px; background:var(--panel); font-size:14px; }
  .spend.limit { border-color:var(--bad); }
  .spend b::before { content:"■ "; color:var(--bad); }
  .ev.usage .k { color:var(--bad); }
  /* Simple / Details */
  .view { display:inline-flex; padding:2px; border:1px solid var(--line); border-radius:999px; background:var(--panel); flex:none; }
  .view button { margin:0; border:0; background:transparent; padding:4px 12px; border-radius:999px; font-size:13px; color:var(--dim); transition:background .2s cubic-bezier(0.16,1,0.3,1), color .2s cubic-bezier(0.16,1,0.3,1); }
  .view button[aria-pressed="true"] { background:var(--raised); color:var(--text); }
  body.simple #timeline, body.details #simple, body.simple #briefBtn, body.simple #knows { display:none; }
  /* What Auren knows: preferences learned from your own receipts (Details view) */
  .knows { margin:12px 0; padding:14px 16px; border:1px solid var(--line); border-radius:14px; background:var(--panel); font-size:14px; }
  .knows summary { cursor:pointer; color:var(--text); }
  .knows .pref { display:flex; gap:10px; align-items:baseline; padding:8px 0; border-top:1px solid var(--line); }
  .knows .pref:first-of-type { border-top:0; }
  .knows .pref > div { flex:1; min-width:0; overflow-wrap:anywhere; }
  .knows .muted, .knows .ev-ids { color:var(--dim); font-size:12px; }
  .knows .conf { font-variant-numeric:tabular-nums; color:var(--dim); font-size:12px; }
  .knows .conf.in { color:var(--done); }
  body.simple .approval { padding:18px; }
  body.simple .approval > div:first-child { font-size:17px; }
  body.simple .approval button { padding:12px 18px; font-size:16px; }
  body.simple .approval button.gold { flex:1; }
  .cmd { margin:12px 0; padding:14px 16px; border:1px solid var(--line); border-radius:16px; background:var(--panel); }
  .cmd.new { animation:rise .45s cubic-bezier(0.16,1,0.3,1) both; }
  @keyframes rise { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
  .cmd .when { float:right; font-size:12px; color:var(--dim); margin-left:8px; }
  .cmd .said { font-size:17px; }
  .cmd .ackl { margin-top:6px; color:var(--dim); font-size:14px; }
  .cmd .done { margin-top:10px; }
  .cmd .done::before { content:"✓ "; color:var(--done); }
  .cmd .done button { margin-left:8px; }
  .cmd .stop { margin-top:10px; color:var(--bad); }
  .cmd .stop::before { content:"■ "; }
  .cmd .reply { margin-top:10px; padding-top:10px; border-top:1px solid var(--line); }
  @media (prefers-color-scheme: light) {
    :root { color-scheme:light; --bg:#FFFFFF; --panel:#F2F2F7; --raised:#FFFFFF; --line:#D1D1D6; --text:#0B0B0C; --dim:#5E5B55; --gold:#92712A; --done:#008932; --bad:#E9152D; --proof:#1E6EF4; }
    button.gold { background:#735921; border-color:#735921; color:#FFFFFF; }
  }
  @media (prefers-reduced-motion:reduce) { .cmd.new { animation:none; } }
</style>
</head>
<body>
<header>
  <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><g fill="none" stroke="var(--gold)" stroke-width="1.2"><circle cx="11" cy="11" r="10" opacity=".35"/><circle cx="11" cy="11" r="7" opacity=".6"/><circle cx="11" cy="11" r="4"/></g><circle cx="11" cy="11" r="1.6" fill="var(--gold)"/></svg>
  <span class="brand">AUREN</span><span class="me" id="me"></span>
  <div class="chips" id="chips"></div>
  <div class="view" role="group" aria-label="View"><button type="button" data-view="simple" aria-pressed="true">Simple</button><button type="button" data-view="details" aria-pressed="false">Details</button></div>
  <span class="trust" id="trust" title="Checks the log's hash chain every 15 seconds">checking the log…</span>
</header>
<main><div id="spend" class="spend" role="status" hidden></div><div id="pair" class="card pair" hidden></div><div id="pending"></div><div id="cards"></div><div id="simple"></div><details id="knows" class="knows"><summary>What Auren knows</summary><div id="knowsBody" class="muted">Nothing learned yet.</div></details><div id="timeline"></div></main>
<form id="f">
  <div class="bar"><input type="text" id="q" placeholder="Say it once…" autocomplete="off"><button>Say it</button></div>
  <div class="tools">
    <label><input type="checkbox" id="voice" checked> speak replies</label>
    <label><input type="checkbox" id="offline"> go offline (test handoff)</label>
    <button type="button" id="pairBtn">Pair a device</button>
    <button type="button" id="briefBtn" title="Runs the scheduled morning briefing now (demo)">Run briefing now</button>
  </div>
</form>
<script>
const qs = new URLSearchParams(location.search);
const kind = qs.get("kind") || "web";
const token = qs.get("token") || "";
const PRESETS = {
  web:     { inputs: ["text", "touch"], outputs: ["screen", "voice"] },
  phone:   { inputs: ["voice", "text", "touch", "camera"], outputs: ["voice", "screen"] },
  watch:   { inputs: ["voice", "text", "touch"], outputs: ["voice", "haptic", "screen"] },
  glasses: { inputs: ["voice", "camera"], outputs: ["voice"] },
};
const surface = { id: qs.get("id") || `${kind}-${Math.random().toString(36).slice(2, 6)}`, kind, name: qs.get("name") || kind, ...(PRESETS[kind] || PRESETS.web) };
const $ = (id) => document.getElementById(id);
const auth = token ? { Authorization: `Bearer ${token}` } : {};
const online = new Map();
$("me").textContent = `this tab = ${surface.name} (${surface.id})`;

function chips() {
  $("chips").innerHTML = [...online.values()].map((s) => `<span class="chip ${s.id === surface.id ? "on" : ""}">${s.kind}</span>`).join("");
}
function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]); }
// What the camera saw: the SAM 3.1 crop on a receipt that followed glasses.look.
const seen = (d) => /^crop_[0-9a-f]{16}$/.test(d.crop_id ?? "") ? `<img class="seen" alt="What Auren saw" src="/v1/crops/${d.crop_id}${token ? `?token=${encodeURIComponent(token)}` : ""}">` : "";
function line(e) {
  const d = e.data, time = new Date(e.at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  const body = {
    utterance: () => `“${esc(d.text)}”`,
    ack: () => esc(d.text),
    tool_call: () => `${esc(d.app)} · ${esc(d.tool)} <span class="t">${esc(d.tier)}</span>`,
    receipt: () => `${esc(d.summary)}${/^https:\/\//.test(d.link ?? "") ? ` <a class="proof" href="${esc(d.link)}" target="_blank" rel="noopener">See it</a>` : ""}${d.undo ? ` <button data-undo="${e.id}">Undo</button>` : ""}${seen(d)}`,
    approval: () => `${esc(d.status)}${d.summary ? `: ${esc(d.summary)}` : ""}${d.surface_id ? ` <span class="t">on ${esc(d.surface_id)}</span>` : ""}${d.signed_by ? ` <span class="signed">✓ signed by ${esc(d.signed_by)}</span>` : ""}`,
    device: () => `${esc(d.device_id)} ${esc(d.status)}${d.hardware ? " · key in the Secure Enclave" : ""}`,
    handoff: () => `${d.what === "speech" ? "reply" : "approval"} moved ${esc(d.from)} → ${esc(d.to ?? "nowhere yet")}${d.remaining ? ` <span class="t">${esc(d.remaining)} sentences left</span>` : ""}`,
    reply: () => esc(d.text),
    error: () => esc(d.message),
    surface: () => `${esc(d.kind)} ${esc(d.surface_id)} ${esc(d.status)}`,
    browser_frame: () => `${/^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(d.frame ?? "") ? `<img class="frame" src="${d.frame}" alt="">` : ""}${esc(d.host)} · step ${esc(d.step)}${d.status === "paused" ? " · waiting for your tap" : d.status === "stopped" ? " · stopped" : ""}`,
    usage: () => esc(d.message), // R13
    proactive: () => `${d.job === "evening" ? "Evening card" : "Morning briefing"} · ${esc(d.status)}${d.by ? ` <span class="t">${esc(d.by)}</span>` : ""}${d.spoken_on ? ` <span class="t">spoken on ${esc(d.spoken_on)}</span>` : ""}${d.shown_on ? ` <span class="t">card on ${esc(d.shown_on)}</span>` : ""}`,
    decision: () => `${d.by === "rules" ? "Rules" : "Muse"} decided: ${esc((d.apps ?? []).join(", ") || "no apps")} · ${esc(d.risk_tier)}${d.reply_surface ? ` · reply on ${esc(d.reply_surface)}` : ""}${d.needs_vision ? " · look first" : ""} <span class=\"t\">${esc(d.ms)} ms</span>`,
  }[e.kind] || (() => esc(JSON.stringify(d)));
  if (e.kind === "usage") spendBanner(d); // R13
  if (e.kind === "receipt" || e.kind === "approval") knowsSoon();
  if (e.kind === "surface") { d.status === "online" ? online.set(d.surface_id, { id: d.surface_id, kind: d.kind }) : online.delete(d.surface_id); chips(); }
  const el = document.createElement("div");
  el.className = `ev ${e.kind}`;
  el.innerHTML = `<div class="k">${e.kind.replace("_", " ")}</div><div class="b">${body()}<span class="t">${time}</span></div>`;
  $("timeline").prepend(el);
  all.push(e); simpleSoon();
}

// Simple: one card per command, in plain sentences. Details is the full timeline above.
const VIEW_KEY = "auren.view";
const all = [], seenCards = new Set();
let view = (() => { try { return localStorage.getItem(VIEW_KEY) === "details" ? "details" : "simple"; } catch { return "simple"; } })();
function setView(v, save = true) {
  view = v;
  if (save) { try { localStorage.setItem(VIEW_KEY, v); } catch {} }
  document.body.className = v;
  document.querySelectorAll("[data-view]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.view === v)));
  simpleView();
  if (v === "details") knows();
}
// What Auren knows: preferences counted from your own receipts, kept encrypted on this Mac.
// Only the ones marked "in the prompt" reach Muse, as your own data; forgetting one takes it out.
async function knows() {
  try {
    const j = await (await fetch(`/v1/preferences`, { headers: auth })).json();
    const list = j.preferences ?? [];
    $("knowsBody").innerHTML = list.length
      ? list.map((p) => `<div class="pref"><div><b>${esc(p.label)}</b>: ${esc(p.value)}${p.detail ? ` <span class="muted">${esc(p.detail)}</span>` : ""}
          <div class="ev-ids">seen ${esc(p.evidence.count)} of ${esc(p.evidence.total)} times · latest receipts ${p.evidence.latest.map((id) => `#${esc(id)}`).join(", ")}</div></div>
          <span class="conf ${p.confidence >= j.threshold ? "in" : ""}" title="${p.confidence >= j.threshold ? "Confident enough to be in Muse's prompt" : "Below the threshold: not in the prompt"}">${Math.round(p.confidence * 100)}%</span>
          <button type="button" data-forget="${esc(p.key)}">Forget</button></div>`).join("") + `<div class="pref"><div class="muted">Learned on this Mac from your receipts; it fades unless it repeats and never skips a tap.</div><button type="button" data-forget="*">Forget everything</button></div>`
      : `<div class="muted">Nothing learned yet. Auren learns from what you approve.</div>`;
  } catch { /* Core restarting */ }
}
let knowsTimer;
const knowsSoon = () => { if (view !== "details") return; clearTimeout(knowsTimer); knowsTimer = setTimeout(knows, 600); };
function ago(at) {
  const s = Math.max(0, (Date.now() - new Date(at).getTime()) / 1000);
  if (s < 45) return "now";
  if (s < 3600) return `${Math.round(s / 60)} min ago`;
  if (s < 86400) return `${Math.round(s / 3600)} h ago`;
  return new Date(at).toLocaleDateString();
}
let pendingDraw = 0;
function simpleSoon() { if (!pendingDraw) pendingDraw = requestAnimationFrame(() => { pendingDraw = 0; simpleView(); }); }
function simpleView() {
  if (view !== "simple") return;
  const gone = new Set(all.filter((e) => e.kind === "receipt" && e.data.undoes).map((e) => e.data.undoes));
  const groups = [];
  for (const e of all) {
    if (e.kind === "utterance") groups.push({ id: e.id, at: e.at, items: [e] });
    else if (groups.length && ["ack", "receipt", "reply", "error", "approval"].includes(e.kind)) groups.at(-1).items.push(e);
  }
  $("simple").innerHTML = groups.slice().reverse().map((g) => {
    const html = g.items.map((e) => {
      const d = e.data;
      if (e.kind === "utterance") return `<div class="said">“${esc(d.text)}”</div>`;
      if (e.kind === "ack") return `<div class="ackl">${esc(d.text)}</div>`;
      if (e.kind === "receipt" && !d.undoes) return `<div class="done">${esc(d.summary)}${/^https:\/\//.test(d.link ?? "") ? ` <a class="proof" href="${esc(d.link)}" target="_blank" rel="noopener">See it</a>` : ""}${d.undo ? (gone.has(e.id) ? ` <span class="muted">Undone</span>` : ` <button data-undo="${e.id}">Undo</button>`) : ""}</div>`;
      if (e.kind === "approval" && (d.status === "declined" || d.status === "expired")) return `<div class="ackl">${d.status === "declined" ? "You said not now" : "Nobody tapped"}, so nothing went out.</div>`;
      if (e.kind === "error") return `<div class="stop">${esc(d.message)}</div>`;
      if (e.kind === "reply") return `<div class="reply">${esc(d.text)}</div>`;
      return "";
    }).join("");
    const fresh = !seenCards.has(g.id); seenCards.add(g.id);
    return `<article class="cmd${fresh ? " new" : ""}"><span class="when">${esc(ago(g.at))}</span>${html}</article>`;
  }).join("");
}
setInterval(simpleView, 30000);

let ws, beat;
function beatEvery(ms) {
  clearInterval(beat);
  beat = setInterval(() => !$("offline").checked && ws.send(JSON.stringify({ type: "heartbeat", active: document.hasFocus() })), ms);
}
// Speak each sentence and tell Core when it finished, so if this tab drops mid-reply the rest moves on.
function say(m) {
  const done = () => m.reply_id != null && ws.readyState === 1 && ws.send(JSON.stringify({ type: "speak_progress", reply_id: m.reply_id, seq: m.seq }));
  if (!$("voice").checked || !surface.outputs.includes("voice")) return done();
  const u = new SpeechSynthesisUtterance(m.text);
  u.onend = done;
  speechSynthesis.speak(u);
}
function connect() {
  ws = new WebSocket(`${location.origin.replace(/^http/, "ws")}/v1/surface${token ? `?token=${encodeURIComponent(token)}` : ""}`);
  ws.onopen = () => {
    ws.send(JSON.stringify({ type: "hello", surface }));
    beatEvery(1000);
  };
  ws.onclose = () => { clearInterval(beat); setTimeout(connect, 1000); };
  ws.onmessage = ({ data }) => {
    const m = JSON.parse(data);
    if (m.type === "welcome") { m.surfaces.forEach((s) => online.set(s.id, s)); chips(); if (m.heartbeat_ms) beatEvery(m.heartbeat_ms); }
    if (m.type === "event") line(m.event);
    if (m.type === "speak") say(m);
    // A card's one action is approval-free: tapping it says its command, like typing it.
    if (m.type === "show_card") $("cards").insertAdjacentHTML("afterbegin", `<div class="card"><b>${esc(m.title)}</b><div>${esc(m.body)}</div>${m.action ? `<div class="row"><button class="gold" data-cmd="${esc(m.action.command)}">${esc(m.action.label)}</button></div>` : ""}</div>`);
    if (m.type === "approval_request") {
      if (navigator.vibrate) navigator.vibrate(60);
      $("pending").insertAdjacentHTML("afterbegin", `<div class="approval" id="a-${m.request_id}"><div>${esc(m.summary)}</div>
        <div class="row"><button class="gold" data-a="${m.request_id}" data-v="1">${esc(m.verb || "Approve")}</button><button data-a="${m.request_id}" data-v="0">Not now</button></div></div>`);
    }
    if (m.type === "approval_cancel") $(`a-${m.request_id}`)?.remove();
  };
}

// Pairing: a one-time code shown here, typed on the device. Only this Mac can start it.
async function devices() {
  const list = $("devlist");
  if (!list) return;
  const { devices: all } = await (await fetch(`/v1/devices`, { headers: auth })).json();
  list.innerHTML = all.length
    ? all.map((d) => `<div class="dev"><span>${esc(d.name)} <span class="muted">${esc(d.id)} · ${d.hardware ? "Secure Enclave" : "software key"}${d.revoked ? " · revoked" : ""}</span></span>${d.revoked ? "" : `<button type="button" data-revoke="${esc(d.id)}">Revoke</button>`}</div>`).join("")
    : `<div class="muted">No devices paired yet.</div>`;
}
$("pairBtn").addEventListener("click", async () => {
  const box = $("pair");
  box.hidden = false;
  const r = await fetch(`/v1/pair/start`, { method: "POST", headers: auth });
  const j = await r.json().catch(() => ({}));
  box.innerHTML = r.ok
    ? `<b>Pairing code</b><div class="code">${esc(j.code.slice(0, 3))} ${esc(j.code.slice(3))}</div>
       <div class="muted">Type it in Auren's settings on the iPhone or watch within 5 minutes. It works once.</div><div id="devlist"></div>`
    : `<b>Couldn't start pairing</b><div class="muted">${esc(j.error ?? r.status)}</div>`;
  devices();
});

document.addEventListener("click", async (ev) => {
  if (ev.target.dataset?.view) return setView(ev.target.dataset.view);
  const revoke = ev.target.dataset?.revoke;
  if (revoke) { await fetch(`/v1/devices/${encodeURIComponent(revoke)}`, { method: "DELETE", headers: auth }); devices(); return; }
  if (ev.target.id === "briefBtn") {
    ev.target.disabled = true;
    const r = await fetch(`/v1/proactive/briefing`, { method: "POST", headers: auth });
    if (!r.ok) { const j = await r.json().catch(() => ({})); $("cards").insertAdjacentHTML("afterbegin", `<div class="card"><b>Briefing</b><div>${esc(j.error ?? r.status)}</div></div>`); }
    setTimeout(() => { ev.target.disabled = false; }, 3000);
    return;
  }
  const forget = ev.target.dataset?.forget;
  if (forget) { await fetch(forget === "*" ? `/v1/preferences` : `/v1/preferences/${encodeURIComponent(forget)}`, { method: "DELETE", headers: auth }); knows(); return; }
  const cmd = ev.target.dataset?.cmd;
  if (cmd) { ws.send(JSON.stringify({ type: "utterance", text: cmd })); ev.target.closest(".card")?.remove(); return; }
  const a = ev.target.dataset?.a, undo = ev.target.dataset?.undo;
  if (a) { ws.send(JSON.stringify({ type: "approval_response", request_id: a, approved: ev.target.dataset.v === "1" })); $(`a-${a}`)?.remove(); }
  if (undo) { ev.target.disabled = true; await fetch(`/v1/receipts/${undo}/undo`, { method: "POST", headers: auth }); }
});
$("f").addEventListener("submit", (ev) => {
  ev.preventDefault();
  const text = $("q").value.trim();
  if (text) ws.send(JSON.stringify({ type: "utterance", text }));
  $("q").value = "";
});

const KEY_SOURCE = { "secure-enclave": "keys in the Secure Enclave", env: "keys from AUREN_SECRET", file: "keys in a file", memory: "keys in memory" };
async function trust() {
  try {
    const t = await (await fetch(`/v1/trust`, { headers: auth })).json();
    const el = $("trust");
    el.className = `trust ${t.log.ok ? "ok" : "bad"}`;
    el.textContent = t.log.ok ? `Log intact · ${t.log.count} events · ${KEY_SOURCE[t.keys.source] ?? t.keys.source}` : `Log changed: ${t.log.reason}`;
  } catch { /* Core restarting */ }
}
trust(); setInterval(trust, 15000);

// R13: a banner when model tokens pass AUREN_TOKEN_ALARM or reach AUREN_TOKEN_LIMIT. It comes from the
// event stream as it happens, and from /v1/trust on load, in case the event is older than the timeline.
function spendBanner(u) {
  const box = $("spend");
  const limit = u.level === "limit" || u.limited;
  if (box.classList.contains("limit") && !limit) return;
  box.hidden = false;
  box.className = `spend${limit ? " limit" : ""}`;
  box.innerHTML = u.message ? `<b>${limit ? "Token limit" : "Token alarm"}</b> ${esc(u.message)}`
    : `<b>${limit ? "Token limit" : "Token alarm"}</b> ${esc(Number(u.total).toLocaleString())} model tokens used${limit ? `, at AUREN_TOKEN_LIMIT (${esc(Number(u.limit).toLocaleString())}). New commands are refused until you raise it.` : `, past AUREN_TOKEN_ALARM (${esc(Number(u.alarm).toLocaleString())}).`}`;
}
fetch(`/v1/trust`, { headers: auth }).then((r) => r.json()).then((t) => { if (t.usage?.alarmed || t.usage?.limited) spendBanner(t.usage); }).catch(() => {});

setView(view, false);
fetch(`/v1/events`, { headers: auth }).then((r) => r.json()).then(({ events }) => { events.forEach(line); connect(); }).catch(connect);
</script>

name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: core/package-lock.json
      - run: npm ci
        working-directory: core
      - run: npm test
        working-directory: core
      - run: npm run typecheck
        working-directory: core

  driver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: driver/package-lock.json
      - run: npm ci
        working-directory: driver
      - run: npx playwright install --with-deps chromium
        working-directory: driver
      - run: npm test
        working-directory: driver
      - run: npm run typecheck
        working-directory: driver

  router:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run python -m unittest discover -s tests -t .
        working-directory: router

  # The judges' sandbox image (Dockerfile): build it, start it without a key, and check it
  # serves /health, /try and a session while refusing Core's real routes. Never pushed.
  sandbox-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t auren-sandbox:ci .
      - name: smoke test (replay mode)
        run: |
          docker run -d --name sbx --read-only --cap-drop ALL -p 127.0.0.1:8080:8080 auren-sandbox:ci
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8080/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/health | grep -q '"sandbox":true'
          curl -fsS -o /dev/null http://127.0.0.1:8080/try
          curl -fsS -X POST http://127.0.0.1:8080/try/api/session | grep -q '"visitor"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/v1/events)" = 404
      - if: failure()
        run: docker logs sbx

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --no-banner
